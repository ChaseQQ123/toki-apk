<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>托克秘书</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f5f7; min-height: 100vh; }
    
    /* ===== 首页 ===== */
    .home-page { max-width: 500px; margin: 0 auto; padding: 20px 16px; }
    
    .header { text-align: center; padding: 60px 0 30px; }
    .title { font-size: 24px; font-weight: 600; color: #1a1a2e; }
    .subtitle { font-size: 15px; color: #8e8e93; margin-top: 8px; }
    
    .search-box { background: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); cursor: pointer; }
    .search-box span { color: #aeaeb2; font-size: 16px; }
    
    .section-title { font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; }
    
    .func-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .func-card { background: #fff; border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .func-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .func-icon { font-size: 32px; margin-bottom: 8px; }
    .func-name { font-size: 14px; font-weight: 500; color: #333; }
    
    .suggest-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 80px; }
    .suggest-item { background: #fff; border-radius: 12px; padding: 14px 16px; font-size: 15px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .suggest-item:hover { background: #fafafa; }
    .suggest-arrow { color: #c7c7cc; }
    
    /* ===== 底部导航 ===== */
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 0.5px solid #e5e5ea; display: flex; z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
    .tab-item.active { color: #7c3aed; }
    .tab-icon { font-size: 24px; }
    .tab-label { font-size: 11px; color: #8e8e93; }
    .tab-item.active .tab-label { color: #7c3aed; }
    
    /* ===== 对话页 ===== */
    .chat-page { display: none; max-width: 500px; margin: 0 auto; height: 100vh; flex-direction: column; }
    .chat-page.active { display: flex; }
    .home-page.hidden { display: none; }
    
    .chat-header { display: flex; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 0.5px solid #e5e5ea; flex-shrink: 0; }
    .back-btn { font-size: 24px; margin-right: 12px; cursor: pointer; }
    .chat-title { flex: 1; font-size: 17px; font-weight: 600; }
    .chat-btns { display: flex; gap: 14px; }
    .chat-btn { font-size: 22px; cursor: pointer; }
    .chat-btn.active { color: #ff3b30; }
    
    .msg-list { flex: 1; overflow-y: auto; padding: 16px; }
    .msg-item { margin-bottom: 14px; display: flex; }
    .msg-user { flex-direction: row-reverse; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .msg-ai .msg-avatar { background: linear-gradient(135deg,#667eea,#764ba2); margin-right: 10px; }
    .msg-user .msg-avatar { background: #e5e5ea; margin-left: 10px; }
    .msg-body { max-width: 78%; }
    .msg-bubble { padding: 11px 14px; border-radius: 18px; font-size: 16px; line-height: 1.65; word-break: break-all; }
    .msg-ai .msg-bubble { background: #f5f5f7; color: #1a1a2e; border-top-left-radius: 4px; }
    .msg-user .msg-bubble { background: linear-gradient(135deg,#7c3aed,#a78bfa); color: #fff; border-top-right-radius: 4px; }
    .msg-source { font-size: 11px; color: #8e8e93; margin-top: 4px; }
    .msg-actions { display: flex; gap: 8px; margin-top: 6px; }
    .msg-act { font-size: 14px; cursor: pointer; opacity: 0.45; }
    .msg-act:hover { opacity: 1; }
    .msg-img { max-width: 200px; border-radius: 12px; margin-top: 4px; }
    
    .typing { display: flex; gap: 4px; padding: 8px; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #c7c7cc; animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    
    /* ===== 输入区 ===== */
    .input-area { padding: 10px 12px 24px; background: #fff; border-top: 0.5px solid #e5e5ea; flex-shrink: 0; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    .input-btn { width: 36px; height: 36px; border: none; background: #f5f5f7; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .input-btn:hover { background: #e5e5ea; }
    .input-btn.recording { background: #ff3b30; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .text-input { flex: 1; border: none; background: #f5f5f7; border-radius: 20px; padding: 10px 16px; font-size: 16px; outline: none; }
    .send-btn { width: 36px; height: 36px; border: none; background: linear-gradient(135deg,#7c3aed,#a78bfa); color: #fff; border-radius: 50%; font-size: 16px; cursor: pointer; }
    
    /* ===== 弹窗 ===== */
    .modal { position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-box { background: #fff; border-radius: 20px; padding: 24px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 16px; }
    .modal-input { width: 100%; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px; font-size: 15px; outline: none; margin-bottom: 12px; }
    .modal-result { background: #f5f5f7; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.7; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
    .modal-img { max-width: 100%; border-radius: 12px; margin-top: 12px; }
    .modal-btn { width: 100%; background: linear-gradient(135deg,#7c3aed,#a78bfa); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; cursor: pointer; margin-top: 12px; }
    .modal-btn.gray { background: #f5f5f7; color: #1a1a2e; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<!-- ===== 首页 ===== -->
<div class="home-page" id="homePage">
  <div class="header">
    <div class="title">托克秘书</div>
    <div class="subtitle" id="greetText"></div>
  </div>

  <div class="search-box" onclick="openChat('')">
    <span>💬 你想聊点什么？</span>
  </div>

  <div class="suggest-list">
    <div class="suggest-item" onclick="openChat(this.querySelector('.st').textContent)"><span class="st">帮我写一篇工作周报</span><span class="suggest-arrow">›</span></div>
    <div class="suggest-item" onclick="openChat(this.querySelector('.st').textContent)"><span class="st">解释一下什么是量子计算</span><span class="suggest-arrow">›</span></div>
    <div class="suggest-item" onclick="openChat(this.querySelector('.st').textContent)"><span class="st">推荐几个提升效率的方法</span><span class="suggest-arrow">›</span></div>
    <div class="suggest-item" onclick="openChat(this.querySelector('.st').textContent)"><span class="st">帮我翻译一段英文</span><span class="suggest-arrow">›</span></div>
  </div>
</div>

<!-- ===== 底部Tab ===== -->
<div class="tabbar" id="tabbar">
  <div class="tab-item active" onclick="switchTab('home')"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></div>
  <div class="tab-item" onclick="openChat('')"><span class="tab-icon">💬</span><span class="tab-label">对话</span></div>
  <div class="tab-item" onclick="alert('智能体功能开发中')"><span class="tab-icon">🤖</span><span class="tab-label">智能体</span></div>
  <div class="tab-item" onclick="openMine()"><span class="tab-icon">🐼</span><span class="tab-label">我的</span></div>
</div>

<!-- ===== 对话页 ===== -->
<div class="chat-page" id="chatPage">
  <div class="chat-header">
    <span class="back-btn" onclick="closeChat()">←</span>
    <span class="chat-title">托克秘书 🐼</span>
    <div class="chat-btns">
      <span class="chat-btn" id="callBtn" onclick="toggleCall()">📞</span>
      <span class="chat-btn" onclick="document.getElementById('imgFile').click()">📷</span>
      <span class="chat-btn" onclick="document.getElementById('docFile').click()">📄</span>
    </div>
  </div>
  
  <div class="msg-list" id="msgList">
    <div id="msgContainer"></div>
    <div id="typingEl" class="hidden">
      <div class="msg-item msg-ai"><div class="msg-avatar">🐼</div><div class="msg-body"><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div></div>
    </div>
  </div>
  
  <div class="input-area">
    <div class="input-row">
      <button class="input-btn" id="micBtn" onclick="toggleMic()">🎤</button>
      <input type="text" class="text-input" id="inputEl" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
      <button class="send-btn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal" id="mineModal">
  <div class="modal-box">
    <div class="modal-title">🐼 我的</div>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:12px">🐼</div>
      <div style="font-size:18px;font-weight:600" id="myName">用户</div>
      <div style="font-size:14px;color:#8e8e93;margin-top:6px">托克秘书 · 越用越懂你</div>
    </div>
    <div style="display:flex;gap:20px;padding:16px;background:#f5f5f7;border-radius:12px;margin:16px 0">
      <div style="flex:1;text-align:center"><div style="font-size:24px;font-weight:700;color:#7c3aed" id="sMsg">0</div><div style="font-size:12px;color:#8e8e93">对话</div></div>
      <div style="flex:1;text-align:center"><div style="font-size:24px;font-weight:700;color:#7c3aed" id="sTok">0</div><div style="font-size:12px;color:#8e8e93">Token</div></div>
      <div style="flex:1;text-align:center"><div style="font-size:24px;font-weight:700;color:#7c3aed" id="sDay">1</div><div style="font-size:12px;color:#8e8e93">天数</div></div>
    </div>
    <div style="font-size:12px;color:#8e8e93;text-align:center">所有数据存储在本地浏览器</div>
    <button class="modal-btn gray" onclick="closeMine()">关闭</button>
  </div>
</div>

<input type="file" id="imgFile" accept="image/*" onchange="handleImg(event)">
<input type="file" id="docFile" accept=".txt,.md,.csv,.json,.js,.py,.html,.css" onchange="handleDoc(event)">

<script>
var ZHIPU_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
var ZHIPU_KEY = 'c4911cf15f844167bd26301e25622cf1.n1BU10ytXbnQ6N5d';

var msgs = [];
var stats = { messages: 0, tokens: 0, startDay: Date.now() };
var dna = { name: '' };
var inCall = false;
var callRec = null;
var silenceTimer = null;
var lastTranscript = '';

window.onload = function() {
  try { var s=localStorage.getItem('ts'); if(s) stats=JSON.parse(s); var d=localStorage.getItem('td'); if(d) dna=JSON.parse(d); var m=localStorage.getItem('tm'); if(m) msgs=JSON.parse(m).slice(-20); } catch(e) {}
  var h=new Date().getHours();
  var greet = h<6?'夜深了，早点休息' : h<12?'早上好' : h<14?'中午好' : h<18?'下午好' : '晚上好';
  if(dna.name) greet += '，' + dna.name;
  document.getElementById('greetText').textContent = greet;
};

function save() { localStorage.setItem('ts', JSON.stringify(stats)); localStorage.setItem('td', JSON.stringify(dna)); localStorage.setItem('tm', JSON.stringify(msgs.slice(-50))); }

function updateStats() {
  document.getElementById('sMsg').textContent = stats.messages;
  document.getElementById('sTok').textContent = stats.tokens;
  var days = Math.max(1, Math.floor((Date.now()-stats.startDay)/86400000)+1);
  document.getElementById('sDay').textContent = days;
}

function switchTab(tab) {
  if (tab === 'home') { closeChat(); closeMine(); }
}

function openChat(text) {
  document.getElementById('homePage').classList.add('hidden');
  document.getElementById('chatPage').classList.add('active');
  document.getElementById('tabbar').classList.add('hidden');
  if (text) { document.getElementById('inputEl').value = text; send(); }
}

function closeChat() {
  document.getElementById('chatPage').classList.remove('active');
  document.getElementById('homePage').classList.remove('hidden');
  document.getElementById('tabbar').classList.remove('hidden');
}

function openMine() { updateStats(); document.getElementById('mineModal').classList.add('open'); }
function closeMine() { document.getElementById('mineModal').classList.remove('open'); }

function addMsg(role, content, source) {
  var box = document.getElementById('msgContainer');
  var isUser = role === 'user';
  var div = document.createElement('div');
  div.className = 'msg-item' + (isUser ? ' msg-user' : '');
  
  var html = '<div class="msg-avatar">' + (isUser ? '👤' : '🐼') + '</div><div class="msg-body">';
  html += '<div class="msg-bubble">' + esc(content) + '</div>';
  if (!isUser && source) {
    html += '<div class="msg-source">' + source + '</div>';
    html += '<div class="msg-actions"><span class="msg-act" onclick="speakText(this)" data-t="' + esc(content).replace(/"/g, '&quot;') + '">🔊</span><span class="msg-act" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.previousElementSibling.textContent)">📋</span></div>';
  }
  html += '</div>';
  div.innerHTML = html;
  box.appendChild(div);
  document.getElementById('msgList').scrollTop = 999999;
}

function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function speakText(el) {
  var text = el.dataset.t;
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.1;
    speechSynthesis.speak(u);
  }
}

var localPatterns = {
  greeting: ['你好','嗨','hi','hello','hey','早上好','晚上好','早安','晚安','在吗'],
  time: ['几点','时间','日期','今天是','星期几','几号'],
  thanks: ['谢谢','感谢','thanks'],
  bye: ['再见','拜拜','bye'],
  identity: ['你叫什么','你是谁','你叫啥','名字','介绍自己'],
  ability: ['能做什么','功能','会什么','有什么用']
};

var localFns = {
  greeting: function() { var h=new Date().getHours(); return (h<6?'这么晚了':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':h<22?'晚上好':'这么晚了')+'！有什么可以帮你的？🐼'; },
  time: function() { var n=new Date(),w=['日','一','二','三','四','五','六']; return n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+w[n.getDay()]+' '+n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'); },
  thanks: function() { return ['不客气！','能帮到你就好~','随时为你服务！'][~~(Math.random()*3)]; },
  bye: function() { return ['再见！有事随时找我~ 🐼','拜拜，下次聊！'][~~(Math.random()*2)]; },
  identity: function() { return '我是托克秘书🐼，你的AI助手！简单的事我直接回答，复杂的请云端专家帮忙。数据安全放心~'; },
  ability: function() { return '我可以：\n💬 日常聊天\n📝 写作/周报\n📊 PPT大纲\n🎨 AI绘画\n🌐 翻译\n💡 解答问题\n简单本地秒回，复杂走云端~'; }
};

function getLocal(text) {
  var t = text.toLowerCase();
  for (var k in localPatterns) { for (var i=0;i<localPatterns[k].length;i++) { if (t.includes(localPatterns[k][i])) return localFns[k](); } }
  return t.length <= 6 ? ['嗯嗯~','好的','收到！','明白'][~~(Math.random()*4)] : null;
}

function send() {
  var el = document.getElementById('inputEl');
  var text = el.value.trim();
  if (!text) return;
  el.value = '';
  
  addMsg('user', text);
  msgs.push({ role: 'user', content: text });
  
  document.getElementById('typingEl').classList.remove('hidden');
  
  var local = getLocal(text);
  if (local) {
    setTimeout(function() {
      document.getElementById('typingEl').classList.add('hidden');
      addMsg('assistant', local, '🏠 本地');
      msgs.push({ role: 'assistant', content: local });
      stats.messages++; save();
    }, 150);
    return;
  }
  
  var sys = '你是托克秘书，聪明简洁的AI助手。请简洁回答。';
  if (dna.name) sys += '用户叫' + dna.name + '。';
  
  fetch(ZHIPU_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ZHIPU_KEY },
    body: JSON.stringify({ model: 'glm-4-flash', messages: [{ role: 'system', content: sys }].concat(msgs.slice(-10)), temperature: 0.7, max_tokens: 500 })
  }).then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('typingEl').classList.add('hidden');
    if (d.choices && d.choices[0]) {
      var reply = d.choices[0].message.content;
      addMsg('assistant', reply, '☁️ 云端');
      msgs.push({ role: 'assistant', content: reply });
      var m = text.match(/我叫(.+)|我是(.+)/);
      if (m) { dna.name = m[1]||m[2]; document.getElementById('myName').textContent = dna.name; save(); }
      stats.messages++; stats.tokens += text.length + reply.length; save();
    }
  }).catch(function() {
    document.getElementById('typingEl').classList.add('hidden');
    addMsg('assistant', '网络有问题，稍后再试~', '❌ 离线');
  });
}

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('请使用Chrome或Edge浏览器'); return;
  }
  var btn = document.getElementById('micBtn');
  if (btn.classList.contains('recording')) {
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    if (window._micRec) try { window._micRec.stop(); } catch(e) {}
    return;
  }
  
  btn.classList.add('recording');
  btn.textContent = '🔴';
  
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var r = new SR();
  r.lang = 'zh-CN';
  r.continuous = false;
  r.interimResults = false;
  
  r.onresult = function(e) {
    document.getElementById('inputEl').value = e.results[0][0].transcript;
    send();
  };
  r.onerror = function() {};
  r.onend = function() { btn.classList.remove('recording'); btn.textContent = '🎤'; };
  r.start();
  window._micRec = r;
}

function toggleCall() {
  inCall ? endCall() : startCall();
}

function startCall() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('请使用Chrome或Edge'); return;
  }
  inCall = true;
  document.getElementById('callBtn').classList.add('active');
  addMsg('system', '📞 语音通话已开始');
  startCallListen();
}

function endCall() {
  inCall = false;
  if (callRec) try { callRec.stop(); } catch(e) {}
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  clearTimeout(silenceTimer);
  document.getElementById('callBtn').classList.remove('active');
  addMsg('system', '📞 通话已结束');
}

function startCallListen() {
  if (!inCall) return;
  
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  callRec = new SR();
  callRec.lang = 'zh-CN';
  callRec.continuous = true;
  callRec.interimResults = true;
  
  callRec.onresult = function(e) {
    var t = '';
    for (var i=e.resultIndex; i<e.results.length; i++) t += e.results[i][0].transcript;
    if (t && t !== lastTranscript) {
      lastTranscript = t;
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(function() {
        if (lastTranscript.trim() && inCall) {
          callProcessMsg(lastTranscript.trim());
          lastTranscript = '';
        }
      }, 1500);
    }
  };
  
  callRec.onerror = function() { if (inCall) setTimeout(startCallListen, 500); };
  callRec.onend = function() { if (inCall) setTimeout(startCallListen, 300); };
  
  callRec.start();
}

function callProcessMsg(text) {
  if (callRec) try { callRec.stop(); } catch(e) {}
  
  addMsg('user', text);
  msgs.push({ role: 'user', content: text });
  document.getElementById('typingEl').classList.remove('hidden');
  
  var local = getLocal(text);
  if (local) {
    setTimeout(function() {
      document.getElementById('typingEl').classList.add('hidden');
      addMsg('assistant', local, '🏠 本地');
      msgs.push({ role: 'assistant', content: local });
      stats.messages++; save();
      speakAndContinue(local);
    }, 150);
    return;
  }
  
  var sys = '你是托克秘书，聪明简洁的AI助手。';
  if (dna.name) sys += '用户叫' + dna.name + '。';
  
  fetch(ZHIPU_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ZHIPU_KEY },
    body: JSON.stringify({ model: 'glm-4-flash', messages: [{ role: 'system', content: sys }].concat(msgs.slice(-10)), temperature: 0.7, max_tokens: 500 })
  }).then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('typingEl').classList.add('hidden');
    if (d.choices && d.choices[0]) {
      var reply = d.choices[0].message.content;
      addMsg('assistant', reply, '☁️ 云端');
      msgs.push({ role: 'assistant', content: reply });
      stats.messages++; stats.tokens += text.length + reply.length; save();
      speakAndContinue(reply);
    }
  }).catch(function() {
    document.getElementById('typingEl').classList.add('hidden');
    addMsg('assistant', '网络有问题~', '❌ 离线');
    speakAndContinue('网络有问题，稍后再试吧');
  });
}

function speakAndContinue(text) {
  if (!inCall) return;
  
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.1;
    u.onend = function() { if (inCall) startCallListen(); };
    u.onerror = function() { if (inCall) startCallListen(); };
    speechSynthesis.speak(u);
  } else {
    if (inCall) startCallListen();
  }
}

function handleImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var base64 = ev.target.result;
    var box = document.getElementById('msgContainer');
    var div = document.createElement('div');
    div.className = 'msg-item msg-user';
    div.innerHTML = '<div class="msg-avatar">👤</div><div class="msg-body"><img class="msg-img" src="' + base64 + '"></div>';
    box.appendChild(div);
    
    document.getElementById('typingEl').classList.remove('hidden');
    fetch(ZHIPU_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ZHIPU_KEY },
      body: JSON.stringify({ model: 'glm-4v-flash', messages: [{ role: 'user', content: [{ type: 'image_url', image_url: { url: base64 } }, { type: 'text', text: '请描述这张图片的内容。' }] }] })
    }).then(function(r) { return r.json(); }).then(function(d) {
      document.getElementById('typingEl').classList.add('hidden');
      if (d.choices && d.choices[0]) addMsg('assistant', d.choices[0].message.content, '☁️ 云端视觉');
    }).catch(function() {
      document.getElementById('typingEl').classList.add('hidden');
      addMsg('assistant', '图片识别失败~', '❌ 错误');
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function handleDoc(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var content = ev.target.result;
    var preview = content.length > 200 ? content.substring(0, 200) + '...' : content;
    addMsg('user', '📄 ' + file.name + '\n' + preview);
    
    document.getElementById('typingEl').classList.remove('hidden');
    msgs.push({ role: 'user', content: '请帮我分析这个文档：\n' + content });
    
    var sys = '你是托克秘书，擅长分析文档。请简洁回答。';
    fetch(ZHIPU_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ZHIPU_KEY },
      body: JSON.stringify({ model: 'glm-4-flash', messages: [{ role: 'system', content: sys }].concat(msgs.slice(-10)), temperature: 0.7, max_tokens: 500 })
    }).then(function(r) { return r.json(); }).then(function(d) {
      document.getElementById('typingEl').classList.add('hidden');
      if (d.choices && d.choices[0]) {
        var reply = d.choices[0].message.content;
        addMsg('assistant', reply, '☁️ 云端');
        msgs.push({ role: 'assistant', content: reply });
        stats.messages++; save();
      }
    }).catch(function() {
      document.getElementById('typingEl').classList.add('hidden');
      addMsg('assistant', '文档分析失败~', '❌ 错误');
    });
  };
  reader.readAsText(file);
  e.target.value = '';
}
</script>
